# 2025年版の設定。翌年はこのファイルをコピーして year と queries を変える。
year = 2025

# 記事を探すときの検索語
queries = [
  "2025年 買ってよかったもの",
  "買ってよかったもの 2025",
  "2025年 ベストバイ",
  "2025 best buy",
]

[affiliate]
# 自分のAmazonアソシエイトのトラッキングID（例: xxxxx-22）。空のあいだはタグなしのリンクを出力する。
# 記事内のリンクに含まれる他人のIDは使わない（リンクはASINから作り直す）。
tag = "korekae0b-22"
# アソシエイト参加表記（Amazonの規約で表示が求められる文言。サイト名は公開先に合わせて変える）
disclosure = "Amazonのアソシエイトとして、korekaeは適格販売により収入を得ています。"
